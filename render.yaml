# Despliegue en Render (https://render.com).
#
# Por qué Render y no Vercel: ATRIO necesita un proceso vivo (worker de cola con
# debounce y serialización por conversación) y un disco persistente para SQLite.
# En un entorno serverless el estado de la conversación se perdería entre
# invocaciones y el asistente olvidaría lo que le acaban de decir.
services:
  - type: web
    name: atrio
    runtime: node
    # free basta para demostrar el producto. Ver la nota sobre durabilidad abajo.
    # Para piloto real con clientes: sube a `starter` y descomenta el bloque `disk`.
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health

    # Disco persistente: sólo disponible en planes de pago.
    # disk:
    #   name: atrio-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: demo

      # En plan free el filesystem es efímero: la base vive mientras el
      # contenedor esté arriba y se borra en cada redeploy o al dormirse.
      #
      # Para una DEMO eso es suficiente: lo que la conversación necesita es
      # recordar los mensajes anteriores, no sobrevivir semanas. Lo que se
      # pierde al reiniciar son los históricos (gaps, consumo, casos viejos),
      # no la capacidad de conversar.
      #
      # Con plan starter + disco, cambiar a: file:/var/data/app.db
      - key: DATABASE_URL
        value: file:/tmp/atrio.db
      - key: TWILIO_VALIDATE_SIGNATURE
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: LOG_REDACT_PII
        value: 'true'
      - key: INBOUND_DEBOUNCE_MS
        value: '1500'
      - key: DATA_RETENTION_DAYS
        value: '90'
      - key: RUN_LIVE_EVALS
        value: 'false'

      # Render expone la URL pública del servicio; la firma de Twilio se calcula
      # sobre esta URL exacta, así que tiene que ser la real y sin slash final.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: atrio
          envVarKey: RENDER_EXTERNAL_URL

      # Secretos: se cargan desde el panel de Render, nunca desde el repo.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
