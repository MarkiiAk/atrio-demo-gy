<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --ink: #1a1d23;
        --ink-soft: #5d6675;
        --ink-faint: #8a929f;
        --line: #e3e7ec;
        --accent: #0f5c4d;
        --accent-soft: #e8f3f0;
        --ok: #1c6b47;
        --ok-soft: #e7f4ed;
        --warn: #8f5600;
        --warn-soft: #fdf2e0;
        --danger: #a32e2e;
        --danger-soft: #fceded;
        --radius: 14px;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1013; --panel: #171a20; --ink: #edf0f5; --ink-soft: #9aa3b2;
          --ink-faint: #6e7786; --line: #262b33;
          --accent: #4bbfa4; --accent-soft: #14302b;
          --ok: #62c893; --ok-soft: #142b20;
          --warn: #e0a458; --warn-soft: #2f2513;
          --danger: #e28686; --danger-soft: #2f1919;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font-family: var(--sans); font-size: 15px; line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }

      header.top {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px;
      }
      .mark {
        width: 42px; height: 42px; border-radius: 11px; flex: 0 0 auto;
        background: var(--accent); color: #fff; display: grid; place-items: center;
        font-weight: 700; font-size: 15px;
      }
      .titles { flex: 1; min-width: 200px; }
      .titles h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
      .titles p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-soft); }
      .tag {
        font-size: 12px; padding: 4px 11px; border-radius: 999px; font-weight: 600;
        background: var(--warn-soft); color: var(--warn);
      }

      nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; }
      nav button {
        appearance: none; border: 1px solid transparent; background: transparent;
        color: var(--ink-soft); font: inherit; font-size: 14px;
        padding: 8px 15px; border-radius: 9px; cursor: pointer;
      }
      nav button:hover { color: var(--ink); background: var(--panel); }
      nav button[aria-selected="true"] {
        background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: 600;
      }

      .cards { display: grid; gap: 13px; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 17px 18px;
      }
      .card .k { font-size: 13px; color: var(--ink-soft); }
      .card .v { font-size: 30px; font-weight: 650; letter-spacing: -.025em; line-height: 1.15; margin: 4px 0 2px; }
      .card .s { font-size: 12.5px; color: var(--ink-faint); }

      section { margin-top: 30px; }
      section > h2 { font-size: 16px; font-weight: 650; margin: 0 0 4px; }
      section > p.lead { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-soft); }

      .surface {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); overflow: hidden;
      }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
      tr:last-child td { border-bottom: 0; }
      tbody tr.click { cursor: pointer; }
      tbody tr.click:hover { background: var(--accent-soft); }
      td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      th.num { text-align: right; }

      .chip {
        display: inline-block; font-size: 12.5px; font-weight: 600;
        padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      }
      .chip.ok { background: var(--ok-soft); color: var(--ok); }
      .chip.warn { background: var(--warn-soft); color: var(--warn); }
      .chip.danger { background: var(--danger-soft); color: var(--danger); }
      .chip.mute { background: var(--bg); color: var(--ink-soft); }

      .sub { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
      .faint { color: var(--ink-faint); }
      .empty { padding: 40px 20px; text-align: center; color: var(--ink-faint); }

      .alert {
        display: flex; gap: 11px; align-items: flex-start;
        border-radius: var(--radius); padding: 13px 16px; margin-bottom: 12px;
        font-size: 14px;
      }
      .alert.warn { background: var(--warn-soft); color: var(--warn); }
      .alert.danger { background: var(--danger-soft); color: var(--danger); }
      .alert.ok { background: var(--ok-soft); color: var(--ok); }
      .alert b { font-weight: 700; }

      .times {
        display: inline-block; min-width: 38px; text-align: center;
        font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
        background: var(--warn-soft); color: var(--warn);
        padding: 3px 9px; border-radius: 8px;
      }

      .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; min-width: 90px; }
      .bar i { display: block; height: 100%; background: var(--accent); }

      dialog {
        border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--panel); color: var(--ink); padding: 0;
        max-width: 620px; width: calc(100% - 32px); max-height: 84vh;
      }
      dialog::backdrop { background: rgba(10, 12, 16, .55); }
      .dh {
        display: flex; align-items: center; gap: 10px; padding: 15px 19px;
        border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel);
      }
      .dh h3 { margin: 0; font-size: 16px; flex: 1; }
      .db { padding: 18px 19px; overflow-y: auto; }
      .x { appearance: none; border: 0; background: transparent; color: var(--ink-soft);
           font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }

      .dl { margin: 0 0 16px; }
      .dl div { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
      .dl div:last-child { border-bottom: 0; }
      .dl dt { flex: 0 0 42%; color: var(--ink-soft); }
      .dl dd { margin: 0; flex: 1; font-weight: 500; }

      .msg { margin-bottom: 10px; display: flex; flex-direction: column; }
      .msg.out { align-items: flex-end; }
      .msg .b {
        max-width: 84%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap;
        background: var(--bg); border: 1px solid var(--line); font-size: 14px;
      }
      .msg.out .b { background: var(--accent); color: #fff; border-color: transparent; }
      .msg .t { font-size: 11.5px; color: var(--ink-faint); margin: 2px 4px 0; }

      ul.plain { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
      ul.plain li { margin-bottom: 3px; }
      .grid2 { display: grid; gap: 13px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
      .box h4 { margin: 0 0 6px; font-size: 14.5px; }
      .box .who { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header class="top">
        <div class="mark" id="mark">··</div>
        <div class="titles">
          <h1 id="company">Cargando…</h1>
          <p id="assistant">&nbsp;</p>
        </div>
        <span class="tag" id="tag" hidden>Demostración</span>
      </header>

      <nav role="tablist">
        <button role="tab" aria-selected="true" data-tab="inicio">Inicio</button>
        <button role="tab" aria-selected="false" data-tab="solicitudes">Solicitudes</button>
        <button role="tab" aria-selected="false" data-tab="conversaciones">Conversaciones</button>
        <button role="tab" aria-selected="false" data-tab="pendientes">Por definir</button>
        <button role="tab" aria-selected="false" data-tab="asistente">Qué sabe hacer</button>
      </nav>

      <main id="view"></main>
    </div>

    <dialog id="dlg">
      <div class="dh">
        <h3 id="dt">Detalle</h3>
        <button class="x" id="dx" aria-label="Cerrar">×</button>
      </div>
      <div class="db" id="dbody"></div>
    </dialog>

    <script>
      (function () {
        'use strict';

        var view = document.getElementById('view');
        var tenant = new URLSearchParams(location.search).get('tenant') || '';

        function api(p) {
          var url = '/api/panel' + p;
          if (tenant) url += (url.indexOf('?') < 0 ? '?' : '&') + 'tenant=' + encodeURIComponent(tenant);
          return fetch(url).then(function (r) {
            if (!r.ok) throw new Error('no se pudo cargar la información');
            return r.json();
          });
        }

        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }
        function chip(text, tone) { return el('span', 'chip ' + (tone || 'mute'), text); }
        function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

        function table(headers, rows, onClick) {
          var s = el('div', 'surface');
          if (!rows.length) {
            s.appendChild(el('div', 'empty', 'Todavía no hay nada que mostrar aquí.'));
            return s;
          }
          var sc = el('div', 'scroll');
          var t = el('table');
          var tr = el('tr');
          headers.forEach(function (h) {
            var th = el('th', h && h.num ? 'num' : null, h && h.text != null ? h.text : h);
            tr.appendChild(th);
          });
          var thead = el('thead'); thead.appendChild(tr); t.appendChild(thead);
          var tb = el('tbody');
          rows.forEach(function (cells, i) {
            var r = el('tr');
            if (onClick) { r.className = 'click'; r.addEventListener('click', function () { onClick(i); }); }
            cells.forEach(function (c) {
              var td = el('td');
              if (c && c.num !== undefined) { td.className = 'num'; td.textContent = String(c.num); }
              else if (typeof c === 'string' || typeof c === 'number') td.textContent = String(c);
              else if (c) td.appendChild(c);
              r.appendChild(td);
            });
            tb.appendChild(r);
          });
          t.appendChild(tb); sc.appendChild(t); s.appendChild(sc);
          return s;
        }

        function section(title, lead, node) {
          var s = el('section');
          s.appendChild(el('h2', null, title));
          if (lead) s.appendChild(el('p', 'lead', lead));
          s.appendChild(node);
          return s;
        }

        function openDialog(title) {
          document.getElementById('dt').textContent = title;
          var b = document.getElementById('dbody');
          b.textContent = '';
          document.getElementById('dlg').showModal();
          return b;
        }

        function defList(pairs) {
          var dl = el('dl', 'dl');
          pairs.forEach(function (p) {
            if (p[1] == null || p[1] === '') return;
            var row = el('div');
            row.appendChild(el('dt', null, p[0]));
            var dd = el('dd');
            if (typeof p[1] === 'string' || typeof p[1] === 'number') dd.textContent = String(p[1]);
            else dd.appendChild(p[1]);
            row.appendChild(dd);
            dl.appendChild(row);
          });
          return dl;
        }

        // ── Inicio ─────────────────────────────────────────────────────────
        function renderInicio(d) {
          view.textContent = '';

          var a = d.attention;
          if (a.pendingCases > 0) {
            var w = el('div', 'alert warn');
            w.innerHTML = '';
            w.appendChild(el('b', null, plural(a.pendingCases, 'solicitud', 'solicitudes')));
            w.appendChild(document.createTextNode(
              ' ' + (a.pendingCases === 1 ? 'está' : 'están') + ' esperando que alguien les dé seguimiento.'));
            view.appendChild(w);
          }
          if (a.unhappyConversations > 0) {
            var dg = el('div', 'alert danger');
            dg.appendChild(el('b', null, plural(a.unhappyConversations, 'persona', 'personas')));
            dg.appendChild(document.createTextNode(
              ' se ' + (a.unhappyConversations === 1 ? 'mostró' : 'mostraron') + ' molesta al escribir. Vale la pena revisar esas conversaciones.'));
            view.appendChild(dg);
          }
          if (a.pendingCases === 0 && a.unhappyConversations === 0) {
            var ok = el('div', 'alert ok');
            ok.appendChild(el('b', null, 'Todo al día. '));
            ok.appendChild(document.createTextNode('No hay solicitudes pendientes ni clientes molestos.'));
            view.appendChild(ok);
          }

          var cards = el('div', 'cards');
          d.headline.forEach(function (h) {
            var c = el('div', 'card');
            c.appendChild(el('div', 'k', h.label));
            c.appendChild(el('div', 'v', h.value));
            c.appendChild(el('div', 's', h.sub));
            cards.appendChild(c);
          });
          view.appendChild(cards);

          if (d.byType.length) {
            var max = Math.max.apply(null, d.byType.map(function (x) { return x.total; }));
            var rows = d.byType.map(function (x) {
              var bar = el('div', 'bar');
              var i = el('i'); i.style.width = Math.round((x.total / max) * 100) + '%';
              bar.appendChild(i);
              return [x.name, { num: x.total }, { num: x.ready }, { num: x.pending }, bar];
            });
            view.appendChild(section('¿Qué le piden a la empresa?',
              'Cada renglón es un motivo por el que la gente escribe.',
              table(['Motivo', { text: 'Total', num: true }, { text: 'Listas', num: true },
                     { text: 'Pendientes', num: true }, ''], rows)));
          }

          if (d.byDepartment.length) {
            var rows2 = d.byDepartment.map(function (x) {
              return [x.name, { num: x.total }, { num: x.ready }, { num: x.pending }];
            });
            view.appendChild(section('¿A qué área le corresponde?', null,
              table(['Área', { text: 'Total', num: true }, { text: 'Listas', num: true },
                     { text: 'Pendientes', num: true }], rows2)));
          }

          var kbox = el('div', 'surface');
          var kp = el('div'); kp.style.padding = '16px 18px';
          kp.appendChild(el('div', null,
            'El asistente responde con base en ' + plural(d.knowledge.sources, 'documento', 'documentos') +
            ' de la empresa (' + d.knowledge.website + ' del sitio web' +
            (d.knowledge.documents ? ' y ' + plural(d.knowledge.documents, 'documento interno', 'documentos internos') : '') + ').'));
          kp.appendChild(el('div', 'sub', 'Última actualización: ' + d.knowledge.lastUpdate + '. Si algo no está aquí, el asistente no lo afirma.'));
          kbox.appendChild(kp);
          view.appendChild(section('De dónde saca la información', null, kbox));
        }

        // ── Solicitudes ────────────────────────────────────────────────────
        function renderSolicitudes(d) {
          view.textContent = '';
          var cs = d.cases;

          view.appendChild(section('Solicitudes capturadas',
            'Todo lo que el asistente recabó sin que nadie tuviera que contestar. Haga clic en un renglón para ver el detalle completo.',
            table(
              ['Folio', 'Motivo', 'Persona', 'Área', 'Estado', 'Recibida'],
              cs.map(function (c) {
                var m = el('div');
                m.appendChild(el('div', null, c.type));
                if (c.summary) m.appendChild(el('div', 'sub', c.summary));

                var p = el('div');
                p.appendChild(el('div', null, c.person.name || 'Sin nombre'));
                p.appendChild(el('div', 'sub', c.person.phone || c.person.channel));

                var st = el('div');
                st.appendChild(chip(c.status.label, c.status.tone));
                if (c.urgency) { st.appendChild(document.createTextNode(' ')); st.appendChild(chip(c.urgency.label, c.urgency.tone)); }

                return [el('span', 'chip mute', c.folio), m, p, c.department, st, c.received];
              }),
              function (i) { showCase(cs[i]); }
            )));
        }

        function showCase(c) {
          var b = openDialog(c.folio + ' · ' + c.type);

          var st = el('div');
          st.appendChild(chip(c.status.label, c.status.tone));
          if (c.urgency) { st.appendChild(document.createTextNode(' ')); st.appendChild(chip(c.urgency.label, c.urgency.tone)); }
          b.appendChild(st);
          b.appendChild(el('p', 'sub', c.status.hint));

          if (c.note) {
            var n = el('div', 'alert warn');
            n.textContent = c.note;
            b.appendChild(n);
          }

          b.appendChild(el('h4', null, 'Lo que nos dijo'));
          if (c.fields.length) {
            b.appendChild(defList(c.fields.map(function (f) { return [f.label, f.value]; })));
          } else {
            b.appendChild(el('p', 'faint', 'Todavía no ha compartido datos concretos.'));
          }

          b.appendChild(el('h4', null, 'Datos de la solicitud'));
          b.appendChild(defList([
            ['Área que le corresponde', c.department],
            ['Cómo nos escribió', c.person.channel],
            ['Teléfono', c.person.phone],
            ['Recibida', c.received],
            ['Folio', c.folio],
          ]));

          var ver = el('button', 'chip mute', 'Ver la conversación completa');
          ver.style.cursor = 'pointer';
          ver.addEventListener('click', function () {
            loadTranscript(c.conversationId, c.person.name || c.person.phone || 'contacto');
          });
          b.appendChild(ver);
        }

        // ── Conversaciones ─────────────────────────────────────────────────
        function renderConversaciones(d) {
          view.textContent = '';
          var cs = d.conversations;

          view.appendChild(section('Conversaciones',
            'Todo lo que le escribieron al asistente. Haga clic para leer la plática completa.',
            table(
              ['Persona', 'Último mensaje', 'Cómo escribió', { text: 'Mensajes', num: true }, { text: 'Solicitudes', num: true }, 'Ánimo', 'Actividad'],
              cs.map(function (c) {
                var p = el('div');
                p.appendChild(el('div', null, c.person.name || 'Sin nombre'));
                if (c.person.phone) p.appendChild(el('div', 'sub', c.person.phone));
                var prev = el('div', 'sub');
                prev.textContent = (c.preview || '').slice(0, 80);
                return [p, prev, c.channel, { num: c.messages }, { num: c.requests },
                        c.mood ? chip(c.mood.label, c.mood.tone) : el('span', 'faint', '—'),
                        c.lastActivity];
              }),
              function (i) { loadTranscript(cs[i].id, cs[i].person.name || cs[i].person.phone || 'contacto'); }
            )));
        }

        function loadTranscript(id, who) {
          var b = openDialog('Conversación con ' + who);
          b.appendChild(el('div', 'empty', 'Cargando…'));
          api('/conversations/' + id + '/transcript').then(function (d) {
            b.textContent = '';
            if (!d.messages.length) { b.appendChild(el('div', 'empty', 'Sin mensajes.')); return; }
            d.messages.forEach(function (m) {
              var row = el('div', 'msg' + (m.from === 'asistente' ? ' out' : ''));
              row.appendChild(el('div', 'b', m.text || '(sin texto)'));
              row.appendChild(el('div', 't', (m.from === 'asistente' ? 'Asistente' : 'Cliente') + ' · ' + m.at));
              b.appendChild(row);
            });
          }).catch(function () { b.textContent = 'No se pudo cargar la conversación.'; });
        }

        // ── Por definir ────────────────────────────────────────────────────
        function renderPendientes(d) {
          view.textContent = '';

          var info = el('div', 'alert warn');
          info.appendChild(el('b', null, '¿Para qué sirve esto? '));
          info.appendChild(document.createTextNode(
            'Aquí aparece lo que le preguntaron al asistente y no pudo responder, porque no está en la información que le dieron. ' +
            'Mientras más veces se repita algo, más vale la pena resolverlo.'));
          view.appendChild(info);

          view.appendChild(table(
            [{ text: 'Veces', num: true }, 'Qué le preguntaron', 'Qué conviene hacer', 'Motivo', 'Última vez'],
            d.gaps.map(function (g) {
              var cat = el('div');
              cat.appendChild(el('div', null, g.category));
              cat.appendChild(el('div', 'sub', g.categoryHint));
              return [
                el('span', 'times', g.times + '×'),
                g.topic,
                g.action ? el('span', 'sub', g.action) : el('span', 'faint', '—'),
                cat,
                g.lastSeen,
              ];
            })
          ));
        }

        // ── Qué sabe hacer ─────────────────────────────────────────────────
        function renderAsistente(d) {
          view.textContent = '';

          var intro = el('div', 'surface');
          var ib = el('div'); ib.style.padding = '16px 18px';
          ib.appendChild(el('div', null, d.assistantName + ' atiende con un trato ' + d.treatment + '.'));
          ib.appendChild(el('div', 'sub', 'Estilo: ' + d.tone + '.'));
          intro.appendChild(ib);
          view.appendChild(intro);

          var g = el('div', 'grid2');
          d.handles.forEach(function (h) {
            var box = el('div', 'box');
            box.appendChild(el('h4', null, h.name));
            box.appendChild(el('div', 'who', 'Se turna a ' + h.department));
            if (h.asksFor.length) {
              box.appendChild(el('div', 'sub', 'Siempre pregunta:'));
              var ul = el('ul', 'plain');
              h.asksFor.forEach(function (a) { ul.appendChild(el('li', null, a)); });
              box.appendChild(ul);
            }
            if (h.verifies.length) {
              box.appendChild(el('div', 'sub', 'Verifica contra el catálogo: ' + h.verifies.join(', ')));
            }
            g.appendChild(box);
          });
          view.appendChild(section('Motivos que sabe atender',
            'Si alguien escribe por algo que no está en esta lista, el asistente lo registra igual para que ustedes lo revisen.', g));

          var nb = el('div', 'surface');
          var nbb = el('div'); nbb.style.padding = '16px 18px';
          var ul2 = el('ul', 'plain');
          d.neverDoes.forEach(function (n) { ul2.appendChild(el('li', null, n)); });
          nbb.appendChild(ul2);
          nb.appendChild(nbb);
          view.appendChild(section('Lo que nunca hace',
            'Estas reglas las aplica el sistema, no dependen de la buena voluntad del asistente.', nb));

          var rb = d.routing.map(function (r) { return [r.department, r.behaviour]; });
          view.appendChild(section('Qué pasa con cada solicitud', null,
            table(['Área', 'Qué ocurre cuando está completa'], rb)));
        }

        // ── Navegación ─────────────────────────────────────────────────────
        var TABS = {
          inicio: { path: '/summary', render: renderInicio },
          solicitudes: { path: '/cases', render: renderSolicitudes },
          conversaciones: { path: '/conversations', render: renderConversaciones },
          pendientes: { path: '/gaps', render: renderPendientes },
          asistente: { path: '/capabilities', render: renderAsistente },
        };

        function show(tab) {
          Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
            b.setAttribute('aria-selected', String(b.dataset.tab === tab));
          });
          view.textContent = '';
          view.appendChild(el('div', 'empty', 'Cargando…'));
          var T = TABS[tab];
          api(T.path).then(T.render).catch(function (e) {
            view.textContent = '';
            view.appendChild(el('div', 'empty', e.message));
          });
        }

        Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
          b.addEventListener('click', function () { show(b.dataset.tab); });
        });
        document.getElementById('dx').addEventListener('click', function () {
          document.getElementById('dlg').close();
        });

        api('/summary').then(function (d) {
          document.getElementById('company').textContent = d.tenant.name;
          document.getElementById('assistant').textContent = d.tenant.assistantName;
          document.title = 'Panel — ' + d.tenant.name;
          var words = String(d.tenant.name).split(/\s+/).filter(Boolean);
          document.getElementById('mark').textContent =
            (words[0] ? words[0][0] : '') + (words[1] ? words[1][0] : '');
          if (d.tenant.isDemo) document.getElementById('tag').hidden = false;
          renderInicio(d);
        }).catch(function (e) {
          document.getElementById('company').textContent = 'No se pudo cargar el panel';
          view.appendChild(el('div', 'empty', e.message));
        });
      })();
    </script>
  </body>
</html>
